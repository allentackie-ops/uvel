<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uvel — The swatch opens</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #F5EEE7; }
    #screen {
      position: relative;
      width: 393px;
      height: 852px;
      overflow: hidden;
      background: #F5EEE7;
    }
    #intro {
      position: absolute;
      inset: 0;
      background: #F5EEE7 url("../../assets/splash.png") center / cover no-repeat;
      will-change: opacity;
    }
    #card {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(70vw, 292px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%) scale(.985);
      opacity: 0;
      filter: drop-shadow(0 7px 16px rgba(74, 32, 25, .08));
      will-change: opacity, transform;
    }
    #reveal {
      position: absolute;
      inset: 0;
      overflow: hidden;
      clip-path: inset(0 49.5% 0 49.5%);
      border-radius: 2px;
      will-change: clip-path;
    }
    #logo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <main id="screen" aria-label="Uvel app intro preview">
    <div id="intro">
      <div id="card">
        <div id="reveal"><img id="logo" src="../../assets/icon.png" alt=""></div>
      </div>
    </div>
  </main>
  <script>
    const intro = document.querySelector('#intro');
    const card = document.querySelector('#card');
    const reveal = document.querySelector('#reveal');
    const clamp = (x) => Math.max(0, Math.min(1, x));
    const outCubic = (x) => 1 - Math.pow(1 - clamp(x), 3);
    window.renderAt = (seconds) => {
      const t = clamp(seconds);
      const opened = outCubic(t / 0.46);
      const inset = 49.5 * (1 - opened);
      const entrance = outCubic(t / 0.18);
      const settle = outCubic(t / 0.52);
      const exit = t <= 0.8 ? 1 : 1 - clamp((t - 0.8) / 0.2);
      reveal.style.clipPath = `inset(0 ${inset}% 0 ${inset}%)`;
      card.style.opacity = String(entrance);
      card.style.transform = `translate(-50%, -50%) scale(${0.985 + 0.015 * settle})`;
      intro.style.opacity = String(exit);
    };
    window.renderAt(0);
  </script>
</body>
</html>

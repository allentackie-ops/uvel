name: iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install "PyJWT[crypto]" requests

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Scan for credential-shaped values
        run: npm run security:secrets

      - name: Install JS dependencies
        run: npm ci

      - name: Create iOS signing files
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: python3 scripts/ios_certs.py

      - name: Link EAS project
        run: npx eas-cli init --account allentackie --non-interactive

      - name: Build on EAS
        run: npx eas-cli build --platform ios --profile ci --non-interactive --no-wait

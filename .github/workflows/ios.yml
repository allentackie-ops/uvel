name: iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Create iOS signing files
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          mkdir -p certs
          fastlane ci_certs

      - name: Write credentials.json
        env:
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          P12=$(ls certs/*.p12 | head -n 1)
          PROFILE=$(ls certs/*.mobileprovision | head -n 1)
          python3 -c "
          import json
          cred = {
            'ios': {
              'provisioningProfilePath': '$PROFILE',
              'distributionCertificate': {
                'path': '$P12',
                'password': '''$CERT_PASSWORD'''
              }
            }
          }
          open('credentials.json','w').write(json.dumps(cred, indent=2))
          print('credentials.json ready')
          "

      - name: Build on EAS
        run: npx eas-cli build --platform ios --profile ci --non-interactive --no-wait

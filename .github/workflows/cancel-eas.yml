name: Cancel EAS build
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: EAS build ID to cancel
        required: true
        type: string
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel Expo build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ github.event.inputs.build_id }}
        run: |
          set -euo pipefail
          RESP=$(curl -sS https://api.expo.dev/graphql \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "{\"query\":\"mutation { build { cancelBuild(buildId: \\\"$BUILD_ID\\\") { id status } } }\"}")
          echo "$RESP"
          echo "$RESP" | grep -q '"status"' || { echo "cancel failed"; exit 1; }

name: Cancel EAS build
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: EAS build ID to cancel
        required: false
        type: string
      submission_id:
        description: EAS submission ID to cancel
        required: false
        type: string
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Cancel EAS operation
        run: |
          if [ -n "${{ inputs.submission_id }}" ]; then
            npx eas-cli submit:cancel "${{ inputs.submission_id }}" --non-interactive
          elif [ -n "${{ inputs.build_id }}" ]; then
            npx eas-cli build:cancel "${{ inputs.build_id }}" --non-interactive
          else
            echo "Provide either build_id or submission_id"
            exit 1
          fi

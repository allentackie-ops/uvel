name: Temporary OTA publish for immersive autoplay

on:
  push:
    branches:
      - fix/social-share-sheet-stable

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Publish OTA to Expo production
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: "1"
        run: |
          npx eas-cli@latest update --channel production --platform ios --message "${{ github.event.head_commit.message }}"
          npx eas-cli@latest update --channel production --platform android --message "${{ github.event.head_commit.message }}"

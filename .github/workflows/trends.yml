name: Trends desk

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recaption hosted looks
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY not set — skip recaption"
            exit 0
          fi
          mkdir -p /tmp/desk
          cp docs/looks/*.jpg /tmp/desk/
          python scripts/refresh_desk.py /tmp/desk
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "AI desk: recaption today's looks"
          file_pattern: docs/trends.json

name: Trends desk

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/refresh_trends.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh today's fashion desk"
          file_pattern: docs/trends.json

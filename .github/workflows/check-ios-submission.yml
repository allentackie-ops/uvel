name: Check iOS submission status
on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: EAS submission ID
        required: true
        type: string
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Inspect EAS submission
        run: npx eas-cli submission:view "${{ inputs.submission_id }}" --json

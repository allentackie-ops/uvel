name: Publish OTA update

on:
  workflow_dispatch:
    inputs:
      message:
        description: "OTA update message"
        required: true
        default: "Add Today visual search camera flow"
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish to Expo production channel
        env:
          EXPO_TOKEN: ${{ secrets.ota_publish }}
          CI: "1"
        run: |
          npx eas-cli@latest update --channel production --platform ios --message "${{ inputs.message }}"
          npx eas-cli@latest update --channel production --platform android --message "${{ inputs.message }}"

name: Direct TestFlight

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: EAS iOS build ID whose IPA to upload
        required: true
        type: string
        default: "73640106-5d4c-47bb-b152-6409a26392fb"
      what_to_test:
        description: TestFlight What to Test note
        required: false
        type: string
        default: "Build 29. Current Uvel iOS app."

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Download IPA from EAS artifact
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          ID="${{ inputs.build_id }}"
          echo "Looking up IPA for $ID"
          RAW=$(npx --yes eas-cli@latest build:view "$ID" --json --non-interactive)
          URL=$(python3 - <<'PY'
          import json, os, sys
          s = os.environ.get("RAW") or open("/tmp/eas-build.json").read() if False else sys.stdin.read()
          i = s.find("{")
          if i < 0:
              raise SystemExit(s[:4000])
          j = json.loads(s[i:])
          arts = j.get("artifacts") or {}
          u = arts.get("applicationArchiveUrl") or arts.get("buildUrl")
          if not u:
              raise SystemExit("No IPA URL in:\n" + s[:4000])
          print(u)
          PY
          <<<"$RAW")
          echo "Downloading $URL"
          curl -fL --retry 5 --retry-delay 2 -H "Authorization: Bearer $EXPO_TOKEN" -o uvel.ipa "$URL"
          ls -lh uvel.ipa
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("uvel.ipa")
          if p.stat().st_size < 1_000_000:
              raise SystemExit(f"IPA too small: {p.stat().st_size} bytes")
          head = p.read_bytes()[:4]
          if head != b"PK\x03\x04":
              raise SystemExit(f"Not a zip/ipa, starts with {head!r}")
          print("IPA looks valid")
          PY

      - name: Normalize App Store Connect key
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          key = os.environ["ASC_API_KEY"].replace("\\n", "\n").strip() + "\n"
          Path("AuthKey.p8").write_text(key)
          Path("/tmp/asc_key.pem").write_text(key)
          print("Wrote AuthKey.p8", len(key), "chars")
          PY
          echo "ASC_API_KEY<<EOF" >> "$GITHUB_ENV"
          python3 -c 'import pathlib; print(pathlib.Path("AuthKey.p8").read_text(), end="")' >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Upload IPA to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IPA_PATH: uvel.ipa
          WHAT_TO_TEST: ${{ inputs.what_to_test }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          SPACESHIP_SKIP_2FA_UPGRADE: "1"
        run: fastlane ios testflight_direct --verbose

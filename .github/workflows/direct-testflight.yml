name: Direct TestFlight

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: EAS iOS build ID whose IPA to upload
        required: true
        type: string
        default: "73640106-5d4c-47bb-b152-6409a26392fb"
      what_to_test:
        description: TestFlight What to Test note
        required: false
        type: string
        default: "Build 29. Current Uvel iOS app."

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Download IPA from EAS artifact
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest build:view "$BUILD_ID" --json --non-interactive > /tmp/eas-build.json
          python3 - <<'PY'
          import json, pathlib, sys
          s = pathlib.Path("/tmp/eas-build.json").read_text()
          i = s.find("{")
          if i < 0:
              sys.exit("eas build:view did not return JSON:\n" + s[:4000])
          j = json.loads(s[i:])
          arts = j.get("artifacts") or {}
          u = arts.get("applicationArchiveUrl") or arts.get("buildUrl")
          if not u:
              sys.exit("No IPA URL in:\n" + s[:4000])
          pathlib.Path("/tmp/ipa-url.txt").write_text(u.strip())
          print(u.strip())
          PY
          URL=$(cat /tmp/ipa-url.txt)
          echo "Downloading IPA"
          curl -fL --retry 5 --retry-delay 2 -H "Authorization: Bearer $EXPO_TOKEN" -o uvel.ipa "$URL"
          ls -lh uvel.ipa
          python3 - <<'PY'
          import pathlib, sys
          p = pathlib.Path("uvel.ipa")
          size = p.stat().st_size
          print(f"IPA size: {size} bytes")
          if size < 1_000_000:
              sys.exit(f"IPA too small: {size} bytes")
          head = p.read_bytes()[:4]
          if head != b"PK\x03\x04":
              sys.exit(f"Not a zip/ipa, starts with {head!r}")
          print("IPA looks valid")
          PY

      - name: Write App Store Connect key
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          key = os.environ["ASC_API_KEY"].replace("\\n", "\n").strip() + "\n"
          Path("AuthKey.p8").write_text(key)
          print("Wrote AuthKey.p8")
          PY

      - name: Upload IPA to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: AuthKey.p8
          IPA_PATH: uvel.ipa
          WHAT_TO_TEST: ${{ inputs.what_to_test }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          SPACESHIP_SKIP_2FA_UPGRADE: "1"
        run: fastlane ios testflight_direct --verbose

name: Roll back OTA update

on:
  workflow_dispatch:
    inputs:
      ios_group_id:
        description: "Latest iOS EAS update group to roll back"
        required: true
        type: string
      android_group_id:
        description: "Latest Android EAS update group to roll back"
        required: true
        type: string
      message:
        description: "Rollback message"
        required: true
        default: "Roll back crashing production OTA"
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Roll back iOS production update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: "1"
        run: npx eas-cli@latest update:rollback "${{ inputs.ios_group_id }}" --platform ios --message "${{ inputs.message }}" --non-interactive
      - name: Roll back Android production update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: "1"
        run: npx eas-cli@latest update:rollback "${{ inputs.android_group_id }}" --platform android --message "${{ inputs.message }}" --non-interactive

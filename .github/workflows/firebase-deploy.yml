name: Firebase deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - firebase.json
      - firestore.rules
      - storage.rules
      - functions/**

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Firebase backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Verify deployment identity
        run: |
          python3 - <<'PY'
          import json, os
          with open(os.environ["GOOGLE_APPLICATION_CREDENTIALS"], encoding="utf-8") as f:
              print(json.load(f).get("client_email", "credential has no client_email"))
          PY
          gcloud config get-value project

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install function dependencies
        working-directory: functions
        run: npm install

      - name: Deploy Firestore rules and Functions
        run: |
          # Storage is intentionally excluded here because this deploy identity
          # cannot inspect the Storage API. Analytics and account deletion do not
          # depend on Storage rules being deployed in the same run.
          npx firebase-tools deploy \
            --project uvel-32d32 \
            --only firestore:rules,functions

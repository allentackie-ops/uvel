name: iOS Submit

on:
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install JS dependencies
        run: npm ci

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("AuthKey.p8").write_text(os.environ["ASC_API_KEY"].replace("\\n", "\n").strip() + "\n")
          eas = json.loads(Path("eas.json").read_text())
          eas["submit"] = {
            "production": {
              "ios": {
                "appleTeamId": "24TJHWVK8T",
                "ascApiKeyPath": "AuthKey.p8",
                "ascApiKeyId": os.environ["ASC_KEY_ID"].strip(),
                "ascApiKeyIssuerId": os.environ["ASC_ISSUER_ID"].strip(),
                "companyName": "Uvel",
                "language": "en-US",
              }
            }
          }
          Path("eas.json").write_text(json.dumps(eas, indent=2) + "\n")
          print("submit config ready")
          PY

      - name: Wait for a finished iOS build, then submit
        run: |
          set -e
          for i in $(seq 1 40); do
            echo "poll $i"
            npx eas-cli build:list --platform ios --limit 8 --non-interactive --json > /tmp/builds.json || true
            python3 - <<'PY'
          import json, pathlib
          raw = pathlib.Path("/tmp/builds.json").read_text().strip()
          print(raw[:2000])
          try:
              data = json.loads(raw)
          except Exception:
              raise SystemExit(0)
          items = data if isinstance(data, list) else data.get("builds") or data.get("data") or []
          pathlib.Path("/tmp/build_id").write_text("")
          for b in items:
              status = str(b.get("status") or "").upper()
              bid = str(b.get("id") or b.get("uuid") or "")
              print("build", bid, status, b.get("buildProfile") or b.get("profile"))
              if status in {"FINISHED", "COMPLETE", "COMPLETED"} and bid:
                  pathlib.Path("/tmp/build_id").write_text(bid)
                  break
          PY
            ID=$(cat /tmp/build_id 2>/dev/null || true)
            if [ -n "$ID" ]; then
              echo "Submitting $ID"
              npx eas-cli submit --platform ios --id "$ID" --profile production --non-interactive --no-wait
              exit 0
            fi
            sleep 30
          done
          echo "No finished iOS build on EAS yet"
          exit 1

name: iOS Submit

on:
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install "PyJWT[crypto]" requests

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install JS dependencies
        run: npm ci

      - name: Write App Store Connect key and app id
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          Path("AuthKey.p8").write_text(os.environ["ASC_API_KEY"].replace("\\n", "\n").strip() + "\n")
          app_id = subprocess.check_output(["python3", "scripts/ensure_asc_app.py"], text=True).strip()
          print("ascAppId", app_id)
          eas = json.loads(Path("eas.json").read_text())
          eas["submit"] = {
            "production": {
              "ios": {
                "appleTeamId": "24TJHWVK8T",
                "ascAppId": app_id,
                "ascApiKeyPath": "AuthKey.p8",
                "ascApiKeyId": os.environ["ASC_KEY_ID"].strip(),
                "ascApiKeyIssuerId": os.environ["ASC_ISSUER_ID"].strip(),
                "companyName": "Uvel",
                "language": "en-US",
              }
            }
          }
          Path("eas.json").write_text(json.dumps(eas, indent=2) + "\n")
          PY

      - name: Submit iOS IPA to App Store Connect
        run: timeout 15m npx eas-cli submit --platform ios --latest --profile production --non-interactive --no-wait --verbose

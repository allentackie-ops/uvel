name: Submit iOS build to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Exact EAS iOS build ID to submit
        required: true
        type: string
      what_to_test:
        description: TestFlight What to Test note
        required: true
        default: "Test immersive shopping feedback prompts, haptic responses, personalized ranking, and expo-audio native support."
        type: string

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Apple API dependencies
        run: pip install "PyJWT[crypto]" requests
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Resolve App Store Connect app ID
        id: asc
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: echo "asc_app_id=$(python3 scripts/ensure_asc_app.py)" >> "$GITHUB_OUTPUT"
      - name: Write App Store Connect API key
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path("AuthKey.p8").write_text(os.environ["ASC_API_KEY"].replace("\\n", "\n").strip() + "\n")
          PY
      - name: Configure submit profile
        env:
          ASC_APP_ID: ${{ steps.asc.outputs.asc_app_id }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const p = JSON.parse(fs.readFileSync("eas.json", "utf8"));
          p.submit ??= {};
          p.submit.production ??= {};
          p.submit.production.ios = {
            appleTeamId: "24TJHWVK8T",
            ascAppId: process.env.ASC_APP_ID,
            ascApiKeyPath: "AuthKey.p8",
            ascApiKeyId: process.env.ASC_KEY_ID,
            ascApiKeyIssuerId: process.env.ASC_ISSUER_ID,
            companyName: "Uvel",
            language: "en-US",
          };
          fs.writeFileSync("eas.json", JSON.stringify(p, null, 2) + "\n");
          NODE
      - name: Submit exact iOS build to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: "1"
        run: >-
          npx eas-cli@latest submit
          --platform ios
          --id "${{ inputs.build_id }}"
          --profile production
          --what-to-test "${{ inputs.what_to_test }}"
          --non-interactive
          --wait

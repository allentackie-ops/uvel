name: Pages

# GitHub Pages is not enabled on this repo, and Actions cannot create it
# ("Resource not accessible by integration"). Don't run on push — that
# was emailing a failure every time docs/ changed. Turn Pages on once in
# GitHub → Settings → Pages, then run this workflow manually.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

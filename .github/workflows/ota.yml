name: OTA

on:
  workflow_dispatch:
    inputs:
      message:
        description: What changed
        required: false
        default: OTA update
      channel:
        description: EAS channel
        required: false
        default: production

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install JS dependencies
        run: npm ci

      - name: Publish OTA
        run: npx eas-cli update --channel ${{ github.event.inputs.channel }} --message "${{ github.event.inputs.message }}" --non-interactive

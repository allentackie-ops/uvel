name: OTA

# Token-based publish. Set the repository secret EXPO_TOKEN to an Expo access token.
# Dispatch with channel=production to ship JS to App Store binaries.
# See docs/ota.md.

on:
  workflow_dispatch:
    inputs:
      message:
        description: What changed
        required: false
        default: OTA update
      channel:
        description: EAS channel
        required: false
        default: production

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Scan for credential-shaped values
        run: npm run security:secrets

      - name: Install JS dependencies
        run: npm ci

      - name: Publish OTA
        run: npx eas-cli update --channel ${{ github.event.inputs.channel }} --message "${{ github.event.inputs.message }}" --platform ios --non-interactive
